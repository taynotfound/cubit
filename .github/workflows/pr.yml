# Runs the tests and builds a debug APK for every pull request, attached to the run as an artifact.
# No secrets are used, so this is safe for pull requests from forks.

name: Pull request build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cubit-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          retention-days: 14

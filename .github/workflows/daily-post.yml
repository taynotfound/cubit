# Posts the daily cube to Mastodon (or any Mastodon-compatible server) every day just after it changes (00:00 UTC),
# with a link anyone can play in the browser. Does nothing until both are set (Settings → Secrets and variables → Actions):
#   MASTODON_INSTANCE  the bot account's server, e.g. https://mastodon.social (secret or variable)
#   MASTODON_TOKEN     an access token for that account with the write:statuses scope (Preferences → Development)
# Run it by hand from the Actions tab to test.

name: Daily cube post

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE || vars.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Post today's cube
        run: |
          if [ -z "$MASTODON_INSTANCE" ] || [ -z "$MASTODON_TOKEN" ]; then echo "Mastodon isn't set up; skipping."; exit 0; fi
          node tools/daily-post.mjs > post.txt
          cat post.txt
          curl -fsS -X POST "${MASTODON_INSTANCE%/}/api/v1/statuses" \
            -H "Authorization: Bearer $MASTODON_TOKEN" \
            -H "Idempotency-Key: cubit-daily-$(date -u +%F)" \
            --data-urlencode "status@post.txt" \
            --data-urlencode "visibility=public" \
            --data-urlencode "language=en" > /dev/null
